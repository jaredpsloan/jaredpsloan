name: Update repo index


on:
  schedule:
    # Every Monday at 13:00 UTC
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate README repo table
        env:
          # Needs to list private repos across the whole account, which the
          # default per-repo GITHUB_TOKEN can't do - see README setup notes.
          GH_TOKEN: ${{ secrets.INDEX_PAT }}
        run: bash scripts/generate-index.sh

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update repo index"
          git push
